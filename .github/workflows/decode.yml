name: decode
on:
  push:
    paths: ['b64/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in b64/*.b64; do n=$(basename $f .b64); base64 -d $f > $n.png; done
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add *.png; git commit -m "decode pngs" || exit 0; git push
